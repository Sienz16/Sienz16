<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Hey, I'm Fazli. Welcome to my little corner of GitHub.</title>
<desc id="desc">A dark terminal window with a blinking cursor and a small animated equalizer. Full stack developer from Sabah, Malaysia.</desc>
<style>
.cursor{animation:blink 1.2s steps(1) infinite}.bar{transform-box:fill-box;transform-origin:bottom;animation:level 2s ease-in-out infinite}.b2{animation-delay:-.5s}.b3{animation-delay:-1.2s}.b4{animation-delay:-.8s}
@keyframes blink{50%{opacity:0}}@keyframes level{50%{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.cursor,.bar{animation:none}}
</style>
<rect x="1" y="1" width="998" height="338" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M1 49H999" stroke="#30363d"/>
<g><circle cx="27" cy="25" r="5" fill="#ff7b72"/><circle cx="46" cy="25" r="5" fill="#e3b341"/><circle cx="65" cy="25" r="5" fill="#7ee787"/></g>
<text x="500" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">fazli@github: ~</text>
<text x="44" y="91" font-family="monospace" font-size="16" fill="#7ee787">~ $ whoami</text>
<text x="40" y="162" font-family="Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#f0f6fc">hey, I’m Fazli<tspan fill="#7ee787">.</tspan></text>
<text x="44" y="203" font-family="Arial, sans-serif" font-size="21" fill="#b1bac4">Welcome to my little corner of GitHub.</text>
<g font-family="monospace" font-size="14"><text x="44" y="251" fill="#7ee787">FULL STACK DEV</text><text x="190" y="251" fill="#484f58">/</text><text x="214" y="251" fill="#b1bac4">SABAH, MALAYSIA</text></g>
<text x="44" y="304" font-family="monospace" font-size="15" fill="#8b949e">~ $ You bloom wherever you are planted.</text><rect class="cursor" x="405" y="290" width="9" height="17" fill="#7ee787"/>
<g fill="#7ee787"><rect class="bar" x="865" y="153" width="12" height="65" rx="3"/><rect class="bar b2" x="885" y="128" width="12" height="90" rx="3"/><rect class="bar b3" x="905" y="167" width="12" height="51" rx="3"/><rect class="bar b4" x="925" y="143" width="12" height="75" rx="3"/></g>
<text x="900" y="251" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">work in progress</text>
</svg>
