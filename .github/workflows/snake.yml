name: Generate Snake Animation

on:
  schedule:
    - cron: "0 16 * * *" # Midnight in Malaysia (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Sienz16
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution snake"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
